<style>
body.app{display:block;padding:0;align-items:initial;justify-content:initial;min-height:100%}
.app *{box-sizing:border-box}

.app .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;box-shadow:none}
.app table{width:100%;border-collapse:collapse;font-size:14px}

.app .modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;z-index:20;overflow:auto}

.app .hint{color:var(--muted);font-size:12px;margin-top:4px}

.app .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.app .chips select,.app .chips input{width:auto}
.app .dz{border-top:1px solid var(--line);padding-top:14px}
.app .dz h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.03em}

.app .qr{margin-top:10px;display:flex;justify-content:center;background:#fff;border-radius:8px;padding:8px}
.app .qr svg{width:220px;height:220px;max-width:100%}
.app .modal.wide{max-width:760px}
.app .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--line)}
.app .dot.on{background:#1f9d55;box-shadow:0 0 0 3px rgba(31,157,85,.18)}
.app .seg{display:inline-flex;justify-self:start;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden}

.app .pc .v{font-weight:600;margin-top:2px}
.app .gp{display:inline-block;margin:3px 4px 0 0;padding:0 7px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted);white-space:nowrap}
.app .checks{display:flex;gap:14px;flex-wrap:wrap}
.app .checks label{display:flex;gap:6px;align-items:center;font-weight:400;margin:0}
.app .checks input{width:auto}
.app .ncard{margin-bottom:14px}
.app .ncard h4{margin:0;padding:12px 18px;border-bottom:1px solid var(--line);font-size:15px;display:flex;gap:10px;align-items:center}
.app .lsrv{margin:4px 0 -4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.app .ck{display:grid;grid-template-columns:18px 1fr;gap:4px 8px;font-size:13px;align-items:baseline}
.app .ck i{font-style:normal;font-weight:700;text-align:center}
.app .ck .ok{color:#1f9d55}.app .ck .warn{color:#b7791f}.app .ck .fail{color:var(--err)}.app .ck .off{color:var(--muted)}
.app .ncard .hd{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.app .ncard .hd b{font-size:15px}
.app .ncard .hd .acts{margin-left:auto}
.app .steps{margin:0;padding-left:20px;display:grid;gap:12px}
.app .steps li{padding-left:2px}
.app .cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;user-select:all;-webkit-user-select:all}
.app .warnb{background:#fff6e0;color:#8a5a00;border-radius:8px;padding:8px 12px;font-size:13px}
@media (prefers-color-scheme:dark){.app .warnb{background:#3a2d0c;color:#f3c969}}
.app .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:9px 16px;border-radius:8px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.app .toast.on{opacity:1}
@media (max-width:760px){
  .app .top{flex-wrap:wrap;padding:10px 16px;gap:10px}.app .tabs{margin-left:0;order:3;width:100%}
  .app .bar input{width:100%;order:3}
  .app table,.app tbody,.app tr,.app td{display:block;width:100%}.app thead{display:none}
  .app tr{border-bottom:1px solid var(--line);padding:8px 0}.app tr:last-child{border-bottom:0}
  .app td{border:0;padding:4px 14px}.app td.act{width:100%}
  .app td[data-l]{display:flex;gap:10px;align-items:baseline}
  .app td[data-l]::before{content:attr(data-l);flex:0 0 72px;color:var(--muted);font-size:12px}
  .app td[data-l]>div{min-width:0}
  .app .acts{justify-content:flex-start;flex-wrap:wrap;padding-top:6px}
  .app .kv{grid-template-columns:1fr;gap:2px 0}.app .kv .v{margin-bottom:8px}
  .app .row2{grid-template-columns:1fr}
  .app .pgrid{grid-template-columns:repeat(2,1fr)}
}
</style>

<script>
(function(){
'use strict';
var view=document.getElementById('view'), CL=[], SERVERS=[], ERR={}
function ntitle(id){var n=SERVERS.find(function(x){return x.id===id;});return n?n.title:id;}
function defServer(){var n=SERVERS.find(function(x){return x.default;});return n?n.id:(SERVERS[0]&&SERVERS[0].id);}

function h(tag,attrs,kids){var e=document.createElement(tag);attrs=attrs||{};
  for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v);}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
function api(method,path,body){
  var o={method:method,headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'};
  if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  return fetch('api/'+path,o).then(function(r){
    // без сессии сервер отвечает обычной HTML-страницей 404 — значит, сессия кончилась
    if(r.status===404&&(r.headers.get('Content-Type')||'').indexOf('json')<0){location.reload();throw new Error('session');}
    return r.json().catch(function(){return {ok:false,error:'HTTP '+r.status};}).then(function(j){if(!j.ok)throw new Error(j.error||'ошибка');return j;});});}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},1800);}
function size(n){if(n==null)return '—';var u=['Б','КБ','МБ','ГБ','ТБ'],i=0;n=+n;while(n>=1024&&i<4){n/=1024;i++;}
  var s=(i&&n<10)?n.toFixed(1):Math.round(n).toString();return s.replace(/\.0$/,'').replace('.',',')+' '+u[i];}
function fmtQ(n){var G=1073741824,M=1048576;if(n%G===0)return (n/G)+'G';if(n%M===0)return (n/M)+'M';return String(n);}
function dt(s){if(!s)return '';var d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});}
function plural(n,a,b,c){var m=n%10,mm=n%100;return n+' '+(m===1&&mm!==11?a:(m>=2&&m<=4&&(mm<10||mm>=20)?b:c));}
function dur(sec){sec=Math.floor(sec||0);var d=Math.floor(sec/86400),hh=Math.floor(sec%86400/3600),mi=Math.floor(sec%3600/60);
  return d?plural(d,'день','дня','дней')+' '+hh+' ч':(hh?hh+' ч '+mi+' мин':mi+' мин');}
var ST={active:'активен',disabled:'отключён',expired:'истёк'}, PER={daily:'в день',weekly:'в неделю',monthly:'в месяц'};
function hint(id){if(id==='main')return 'Давайте её по умолчанию.';if(id==='ip')return 'Если у человека не открывается домен.';if(id.indexOf('sni:')===0)return 'Если при ограничениях мобильного интернета первые две не подключаются.';return '';}
function copy(t,msg){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast(msg||'Скопировано');},function(){
  var a=h('textarea',{value:t});document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg||'Скопировано');}catch(e){toast('Не удалось скопировать');}a.remove();});}

/* ---------- modal */
function modal(title,body,buttons,opts){
  opts=opts||{};
  var bg=h('div',{class:'modal-bg'}),m=h('div',{class:'modal'+(opts.wide?' wide':'')});
  var close=function(){bg.remove();document.removeEventListener('keydown',esc);};
  var esc=function(e){if(e.key==='Escape')close();};
  var err=h('div',{class:'msg err'});
  m.appendChild(h('h3',{text:title}));m.appendChild(h('div',{class:'mb'},[err].concat(body)));
  var mf=h('div',{class:'mf'});(buttons||[]).forEach(function(b){
    mf.appendChild(h('button',{class:'btn '+(b.cls||''),text:b.text,onclick:function(){
      if(!b.fn)return close();var btn=this;btn.disabled=true;err.classList.remove('on');
      Promise.resolve().then(b.fn).then(function(r){if(r!==false)close();},function(e){err.textContent=e.message;err.classList.add('on');}).then(function(){btn.disabled=false;});}}));});
  if(buttons&&buttons.length)m.appendChild(mf);
  bg.appendChild(m);bg.addEventListener('mousedown',function(e){if(e.target===bg)close();});
  document.addEventListener('keydown',esc);document.body.appendChild(bg);
  if(opts.focus!==false){var f=m.querySelector('input,textarea,select');if(f)f.focus();}
  return close;}
function field(label,input,hint){return h('div',{},[h('label',{text:label}),input,hint?h('div',{class:'hint',text:hint}):null]);}

/* ---------- clients */
function cellExp(c){
  if(!c.expires)return [h('div',{text:'бессрочно'})];
  if(c.state==='expired')return [h('div',{text:'истёк'}),h('div',{class:'meta',text:dt(c.expires)})];
  return [h('div',{text:'до '+dt(c.expires)}),h('div',{class:'meta',text:'осталось '+plural(c.days_left,'день','дня','дней')})];}
function cellTraffic(c){
  var out=[h('div',{text:size(c.total_bytes)+(c.quota_bytes?' из '+size(c.quota_bytes):'')})];
  if(c.quota_bytes){var p=Math.min(100,Math.round(100*c.total_bytes/c.quota_bytes));
    out.push(h('div',{class:'qbar'+(p>=100?' full':''),title:p+'%'},[h('i',{style:'width:'+p+'%'})]));
    out.push(h('div',{class:'meta',text:c.quota_period?'квота '+PER[c.quota_period]:'квота на всё время'}));}
  var dl=c.max_devices||c.devices_limit;if(dl)out.push(h('div',{class:'meta',text:'до '+plural(dl,'устройства','устройств','устройств')+(c.max_devices?'':' (по серверу)')}));
  return out;}
function ago(ts){if(!ts)return '';var s=Math.floor(Date.now()/1000-ts);
  if(s<120)return 'только что';if(s<3600)return plural(Math.floor(s/60),'минуту','минуты','минут')+' назад';
  if(s<86400)return plural(Math.floor(s/3600),'час','часа','часов')+' назад';return plural(Math.floor(s/86400),'день','дня','дней')+' назад';}
function hm(ts){return new Date(ts*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
function cellOnline(c){
  if(c.online){var n=Math.max(1,c.active_ips.length);
    return [h('div',{},[h('span',{class:'dot on'}),'в сети']),
      h('div',{class:'meta',text:plural(n,'устройство','устройства','устройств')+(c.online_since?' · с '+hm(c.online_since):'')})];}
  var was=c.last_seen||c.total_bytes>0;
  return [h('div',{class:'muted'},[h('span',{class:'dot'}),was?'не в сети':'не подключался']),
    was?h('div',{class:'meta',text:c.last_seen?'был '+ago(c.last_seen):'подключался раньше'}):null];}
function renderClients(){
  var q=h('input',{type:'text',placeholder:'Поиск по имени или заметке',oninput:function(){draw();}});
  var sum=h('div',{class:'sum'}),card=h('div',{class:'card'}),errb=h('div',{}),gseg=h('div',{class:'seg',style:'margin-bottom:12px'});
  view.replaceChildren(h('div',{class:'bar'},[h('h2',{text:'Клиенты'}),q,h('button',{class:'btn pri',text:'+ Добавить',onclick:function(){addDlg(renderClients.srv);}})]),errb,gseg,sum,card);
  function draw(){
    errb.replaceChildren.apply(errb,Object.keys(ERR).map(function(k){return h('div',{class:'msg err on',style:'margin-bottom:10px',text:'Сервер «'+ntitle(k)+'»: '+ERR[k]+' — изменения применятся, когда он ответит.'});}));
    gseg.style.display=SERVERS.length>1?'':'none';
    gseg.replaceChildren.apply(gseg,[['','Все']].concat(SERVERS.map(function(n){return [n.id,n.title];})).map(function(o){
      var cnt=o[0]?CL.filter(function(c){return c.servers.indexOf(o[0])>=0;}).length:CL.length;
      return h('button',{text:o[1]+' · '+cnt,class:(renderClients.srv||'')===o[0]?'on':'',onclick:function(){renderClients.srv=o[0];draw();}});}));
    var G=renderClients.srv||'',VIS=CL.filter(function(c){return !G||c.servers.indexOf(G)>=0;});
    var on=VIS.filter(function(c){return c.connections;}).length,act=VIS.filter(function(c){return c.state==='active';}).length;
    sum.textContent=VIS.length?(plural(VIS.length,'клиент','клиента','клиентов')+' · активных '+act+' · онлайн '+on+' · трафик '+size(VIS.reduce(function(a,c){return a+(c.total_bytes||0);},0))):'';
    var f=q.value.trim().toLowerCase(),rows=VIS.filter(function(c){return !f||c.name.toLowerCase().indexOf(f)>=0||(c.note||'').toLowerCase().indexOf(f)>=0;});
    if(!rows.length){card.replaceChildren(h('div',{class:'empty',text:VIS.length?'Ничего не найдено':'Клиентов пока нет — нажмите «+ Добавить»'}));return;}
    var tbody=h('tbody');
    rows.forEach(function(c){
      tbody.appendChild(h('tr',{},[
        h('td',{},[h('div',{class:'nm',text:c.name}),c.note?h('div',{class:'note',text:c.note}):null,
          SERVERS.length>1||!c.servers.length?h('div',{},c.servers.length?c.servers.map(function(n){return h('span',{class:'gp',text:ntitle(n)});}):[h('span',{class:'gp',style:'color:var(--err)',text:'нет серверов'})]):null,
          c.pending&&c.pending.length?h('div',{class:'meta',text:'ожидает: '+c.pending.map(ntitle).join(', ')}):null]),
        h('td',{'data-l':'Статус',class:'nw'},[h('div',{},[h('span',{class:'pill '+c.state,text:ST[c.state]})])]),
        h('td',{'data-l':'Срок',class:'nw'},[h('div',{},cellExp(c))]),
